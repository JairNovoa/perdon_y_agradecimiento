<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--night:#0d0818;--rose:#ff4d6d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);overflow:hidden;
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;height:100dvh}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;overflow:hidden}
.slide .bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(28px) brightness(.55) saturate(1.2)}
.slide .photo{position:relative;flex:1;min-height:0;padding:max(14px,env(safe-area-inset-top)) 14px 10px}
.slide .photo img{width:100%;height:100%;object-fit:contain;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.55);will-change:transform}
.slide .cap{position:relative;padding:18px 22px max(26px,calc(env(safe-area-inset-bottom) + 18px));
  background:linear-gradient(to top,rgba(8,4,16,.92),rgba(8,4,16,.78));
  text-align:center;min-height:23dvh;display:flex;align-items:center;justify-content:center}
.slide .cap p{max-width:30ch;font-size:clamp(1.35rem,4.6vw,2.2rem);line-height:1.3;font-style:italic;font-weight:600;
  color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
@media (min-width:800px){.slide .cap p{max-width:46ch}}
.slide.final{justify-content:center;align-items:center;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 40%,#5a0f2a 0%,#2a0716 55%,#12040b 100%)}
.final h1{font-size:clamp(2rem,8vw,4rem);font-style:italic;font-weight:600;line-height:1.25;max-width:16ch;
  text-shadow:0 3px 18px rgba(0,0,0,.8)}
.final h1 span{display:block;font-size:1.3em;font-style:normal;margin-top:.25em}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
button{font-family:inherit;cursor:pointer;border:0;color:#fff}
.btn{font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:600;padding:.8em 1.6em;border-radius:999px;
  background:linear-gradient(135deg,#ff4d6d,#c9184a);box-shadow:0 8px 28px rgba(255,77,109,.45);transition:transform .2s}
.btn:hover{transform:scale(1.05)}
.btn:focus-visible,#pause:focus-visible{outline:3px solid #fff;outline-offset:3px}
#restart{margin-top:2rem;opacity:0;pointer-events:none;transition:opacity 1.5s}
#restart.on{opacity:1;pointer-events:auto}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;
  background:radial-gradient(circle at 50% 35%,#2b1650,#0d0818 70%);padding:24px;text-align:center}
#intro .moon{font-size:4rem}
#intro.off{display:none}
#pause{position:fixed;z-index:15;top:max(12px,env(safe-area-inset-top));right:12px;display:none;
  align-items:center;gap:.4em;font-size:1.05rem;font-weight:600;padding:.5em 1em;border-radius:999px;
  background:rgba(13,8,24,.6);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px)}
#pause.on{display:flex}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="fx"></canvas>
<button id="pause" aria-label="Pausar">⏸ Pausar</button>
<div id="intro">
  <div class="moon" aria-hidden="true">🌙</div>
  <button id="start" class="btn">Toca para comenzar 💌</button>
</div>
<audio id="music" src="audio/claro-de-luna.mp3" preload="auto" loop></audio>

<script>
const SLIDES=[
 ["carrera","Hay ausencias que no se explican fácilmente... pero esta merece una explicación."],
 ["fiesta","Sé que desaparecí cuando quizá lo que merecías era una respuesta."],
 ["bernal","No fue porque no me importaras; simplemente no supe cómo enfrentar lo que sentía."],
 ["bacalar","Yo guardé mucho silencio. Tú tuviste demasiada paciencia."],
 ["bacalar2","Y aunque el tiempo pasó, nunca olvidé la manera en que siempre estuviste."],
 ["mahagual","Perdón por dejar preguntas donde debí dejar palabras que dieran respuestas."],
 ["roma","Perdón por hacerte sentir que no eras importante en mi vida. Eres lo más imprtante en ella"],
 ["pisa","No espero que mi ausencia se borre con una disculpa, pero sí quería reconocerla."],
 ["florencia","Gracias por todo lo que diste sin exigir nada a cambio."],
 ["venecia","Gracias por los momentos que vivimos, las risas, los bailes, las locuras, las conversaciones y hasta por aquello que quizá nunca supe agradecer."],
 ["chamonix","Hay personas que dejan huella incluso cuando uno se aleja… tú eres una de ellas."],
 ["eiffel","No sé qué lugar tenga hoy en tu vida, pero sí sé que agradezco haber coincidido contigo."],
 ["cu","Perdón por haberme ido sin decir nada. Gracias por haber estado. Y, sobre todo, gracias por haber significado todo."]
];
const N=SLIDES.length+1, FINAL=N-1, DUR=15000, TR=2600;
const stage=document.getElementById('stage'), els=[];
SLIDES.forEach(([f,txt])=>{
  const s=document.createElement('section'); s.className='slide';
  const src='img/'+f+'.jpg';
  s.innerHTML='<img class="bg" alt="" src="'+src+'"><div class="photo"><img alt="" src="'+src+'"></div><div class="cap"><p></p></div>';
  s.querySelector('p').textContent=txt; stage.appendChild(s); els.push(s);
});
const fin=document.createElement('section'); fin.className='slide final';
fin.innerHTML='<h1>¡Te amo Gabyta, te amo mucho y te extraño demasiado!<br><br><span>😘</span><br></h1><button id="restart" class="btn">Volver a empezar</button>';
stage.appendChild(fin); els.push(fin);
const restartBtn=document.getElementById('restart');

const cv=document.getElementById('fx'), cx=cv.getContext('2d'), music=document.getElementById('music');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

let idx=-1,prev=-1,t=0,playing=false,started=false,last=0,P=[];
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

function go(i){prev=idx;idx=i;t=0;restartBtn.classList.remove('on')}

function emit(dt,p){
  const heart=idx===FINAL, k=Math.sin(Math.PI*p), n=(W*H/9000)*k*dt/1000*(heart?1.1:2.2);
  let c=Math.floor(n)+(Math.random()<n%1?1:0);
  while(c--){
    if(heart) P.push({h:1,x:Math.random()*W,y:H+30,vx:(Math.random()-.5)*40,vy:-(80+Math.random()*160),
      life:0,max:2200+Math.random()*1800,s:16+Math.random()*44,a:(Math.random()-.5)*.6});
    else P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,
      life:0,max:1400+Math.random()*1800,s:6+Math.random()*26,hue:Math.round(Math.random()*360)});
  }
}
function drawFX(dt){
  cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
  P=P.filter(q=>q.life<q.max);
  for(const q of P){
    q.life+=dt;q.x+=q.vx*dt/1000;q.y+=q.vy*dt/1000;
    const r=Math.min(1,q.life/q.max), al=Math.pow(1-r,1.6);
    if(q.h){
      cx.globalCompositeOperation='source-over';cx.globalAlpha=al*.9;
      cx.save();cx.translate(q.x,q.y);cx.rotate(q.a);
      const s=q.s*(.7+.5*r);cx.fillStyle='#e01e37';cx.shadowColor='#ff4d6d';cx.shadowBlur=14;
      cx.beginPath();cx.moveTo(0,s*.8);cx.bezierCurveTo(-s*1.2,0,-s*.6,-s*.9,0,-s*.35);cx.bezierCurveTo(s*.6,-s*.9,s*1.2,0,0,s*.8);cx.fill();cx.restore();cx.shadowBlur=0;
      cx.globalCompositeOperation='lighter';
    }else{
      const s=q.s*(1-r*.6), g=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,s);
      g.addColorStop(0,'hsla('+q.hue+',100%,85%,'+al.toFixed(3)+')');
      g.addColorStop(.35,'hsla('+q.hue+',100%,60%,'+(al*.7).toFixed(3)+')');
      g.addColorStop(1,'hsla('+q.hue+',100%,50%,0)');
      cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();cx.arc(q.x,q.y,s,0,7);cx.fill();
    }
  }
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
}

function frame(now){
  const dt=Math.min(now-last,100);last=now;
  const sdt=playing?dt:0;
  if(playing){
    t+=dt;
    if(idx<FINAL&&t>=DUR)go(idx+1);
  }
  if(idx>=0){
    const p=Math.min(1,t/TR),e=ease(p);
    els.forEach((el,i)=>{
      let o=0;
      if(i===idx)o=e;else if(i===prev&&p<1)o=1-e;
      el.style.opacity=o;el.style.visibility=o>0?'visible':'hidden';
      if(i<FINAL&&o>0){
        const z=1+.07*(i===idx?t/DUR:1);
        el.querySelector('.photo img').style.transform='scale('+Math.min(z,1.07)+')';
      }
    });
    if(sdt&&p<1)emit(sdt,p);
    if(idx===FINAL&&sdt&&Math.random()<.04)emit(100,.5);
    if(idx===FINAL&&t>3500)restartBtn.classList.add('on');
  }
  drawFX(sdt);
  requestAnimationFrame(frame);
}

const pauseBtn=document.getElementById('pause');
function setPlaying(v){
  playing=v;
  pauseBtn.textContent=v?'⏸ Pausar':'▶ Seguir';
  pauseBtn.setAttribute('aria-label',v?'Pausar':'Seguir');
  if(v){music.play().catch(()=>{})}else music.pause();
}
document.getElementById('start').addEventListener('click',()=>{
  document.getElementById('intro').classList.add('off');
  pauseBtn.classList.add('on');
  music.currentTime=0;started=true;go(0);setPlaying(true);
});
pauseBtn.addEventListener('click',()=>{if(started)setPlaying(!playing)});
restartBtn.addEventListener('click',()=>{
  P=[];music.currentTime=0;go(0);setPlaying(true);
});
requestAnimationFrame(n=>{last=n;requestAnimationFrame(frame)});
</script>
</body>
</html>
